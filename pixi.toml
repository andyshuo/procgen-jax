[workspace]
name = "procgen-jax"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
pytest = "*"
ruff = "==0.17.1"

[pypi-dependencies]
jax = ">=0.12"
numpy = ">=2"

[feature.gpu.pypi-dependencies]
jax = { version = ">=0.12", extras = ["cuda12"] }

[environments]
default = { features = [], solve-group = "default" }
gpu = { features = ["gpu"], solve-group = "gpu" }

[tasks]
test = { cmd = "python -m pytest -q", description = "Run the test suite" }
lint = { cmd = "ruff check . && ruff format --check .", description = "Lint and formatting check" }
fmt = { cmd = "ruff format .", description = "Format the code" }
[tasks.train]
cmd = "python examples/train_ppo.py"
description = "Train the PPO baseline (--game, --updates, --compare, --env-only)"

[tasks.train.env]
PYTHONPATH = "."

[tasks.pack]
cmd = "python -m build"
description = "Build the wheel and sdist into dist/ (needs `build`: pixi install after adding it, or `uv build`)"

[tasks.demo]
cmd = "python examples/random_rollout.py"
description = "Run a random rollout"

[tasks.demo.env]
PYTHONPATH = "."

[tasks.video]
cmd = "python examples/record_video.py"
description = "Record one episode of each game (default runs/, or pass a directory)"

[tasks.video.env]
PYTHONPATH = "."

[tasks.play]
cmd = "python examples/play.py"
description = "Play a game in the terminal (see --help for keys and options)"

[tasks.play.env]
PYTHONPATH = "."

[tasks.webplay]
cmd = "python examples/webplay.py"
description = "Play in a browser window: open http://127.0.0.1:8010"

[tasks.webplay.env]
PYTHONPATH = "."

[tasks.atlas]
cmd = "python tools/build_atlas.py"
description = "Download the Kenney sprites and build procgen_jax/data/sprites.npz"

[tasks.reference]
cmd = "python tools/build_reference.py"
description = "Build the C++ level fixture in tests/data (needs the ProcGen sources)"

[tasks.reference.env]
PYTHONPATH = "."

[tasks.maze-reference]
cmd = "python tools/build_maze_reference.py"
description = "Build the C++ maze fixture in tests/data (needs the ProcGen sources)"

[tasks.maze-reference.env]
PYTHONPATH = "."

[tasks.roomgen-reference]
cmd = "python tools/build_roomgen_reference.py"
description = "Build the C++ roomgen fixture in tests/data (needs the ProcGen sources)"

[tasks.roomgen-reference.env]
PYTHONPATH = "."
